<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hening – Musik Streaming Tanpa Iklan</title>
<style>
:root{--bg:#f6f4ef;--panel:#fff;--ink:#17181a;--mute:#6b6f76;--line:#e4e1d9;--acc:#1db36b;--hover:#efece4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0e0f11;--panel:#17181b;--ink:#f1f1ef;--mute:#9a9ea6;--line:#26282c;--acc:#2fd283;--hover:#202226}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:8px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{flex:1;display:flex;flex-direction:column;min-height:0;max-width:980px;width:100%;margin:0 auto}
.top{display:flex;gap:10px;align-items:center;padding:16px 20px 8px;flex-wrap:wrap}
.logo{font-weight:700;font-size:22px;letter-spacing:-.02em;margin-right:auto}.logo b{color:var(--acc)}
input,select{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:9px 14px;border-radius:99px;font:inherit}
#q{flex:1;min-width:160px;max-width:340px}
.chips{display:flex;gap:6px;padding:4px 20px 10px;overflow-x:auto}
.chips button{flex:none;padding:7px 14px;border:1px solid var(--line);border-radius:99px;color:var(--mute);white-space:nowrap}
.chips button.on{background:var(--ink);color:var(--bg)}
#set{display:none;margin:0 20px 8px;padding:12px;border:1px dashed var(--line);border-radius:12px;font-size:13px;color:var(--mute)}
#set input,#set select{width:100%;margin-top:6px;border-radius:10px}
.list{flex:1;overflow-y:auto;padding:0 12px 12px}
.row{display:grid;grid-template-columns:48px 1fr auto auto;gap:12px;align-items:center;padding:8px;border-radius:10px;cursor:pointer}
.row:hover{background:var(--hover)}.row.cur .t{color:var(--acc)}
.cov{width:48px;height:48px;border-radius:8px;background:var(--line) center/cover;flex:none}
.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.s{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s a{color:inherit}
.d{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.heart{color:var(--mute);padding:6px 10px;font-size:18px}.heart.on{color:var(--acc)}
.msg{margin:10vh auto;text-align:center;color:var(--mute);max-width:360px;padding:20px}
.bar{background:var(--panel);border-top:1px solid var(--line);padding:10px 16px;display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:16px;align-items:center}
.now{display:flex;gap:12px;align-items:center;min-width:0}
.ctl{display:flex;flex-direction:column;gap:4px;align-items:center}
.btns{display:flex;gap:6px;align-items:center}
.btns button{width:38px;height:38px;font-size:17px;color:var(--mute)}.btns button.on{color:var(--acc)}
.btns .play{background:var(--ink);color:var(--bg);border-radius:50%;width:42px;height:42px}
.seek{display:flex;gap:8px;align-items:center;width:100%;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:var(--acc);height:20px;padding:0;border:0;background:none}
.vol{display:flex;gap:8px;justify-content:flex-end;align-items:center}.vol input{max-width:110px}
@media (max-width:760px){.bar{grid-template-columns:1fr;gap:6px;padding:10px 14px}.vol{display:none}.row{grid-template-columns:48px 1fr auto}.row .d{display:none}.top{padding:12px 14px 6px}.chips{padding:4px 14px 8px}#set{margin:0 14px 8px}}
</style>
</head>
<body>
<main>
 <div class="top">
  <div class="logo">Hening<b>.</b></div>
  <input type="search" id="q" placeholder="Cari lagu atau artis…" aria-label="Cari">
  <button class="chips" style="padding:0" id="gear" aria-label="Pengaturan">⚙</button>
 </div>
 <div id="set">
  Kunci API Audius (gratis di api.audius.co/plans). Kosongkan jika katalog sudah terbuka tanpa kunci.
  <input id="key" placeholder="API key / bearer token" autocomplete="off">
  <select id="base"><option value="https://api.audius.co/v1">api.audius.co</option><option value="https://discoveryprovider.audius.co/v1">discoveryprovider.audius.co</option></select>
 </div>
 <div class="chips" id="chips"></div>
 <div class="list" id="list"></div>
</main>
<div class="bar">
 <div class="now"><div class="cov" id="ncov"></div><div style="min-width:0"><div class="t" id="nt">Belum ada lagu</div><div class="s" id="ns">Pilih lagu untuk memutar</div></div></div>
 <div class="ctl">
  <div class="btns">
   <button id="shuf" aria-label="Acak" title="Acak">⤮</button>
   <button id="prev" aria-label="Sebelumnya">⏮</button>
   <button id="pp" class="play" aria-label="Putar atau jeda">▶</button>
   <button id="next" aria-label="Berikutnya">⏭</button>
   <button id="rep" aria-label="Ulangi" title="Ulangi">⟲</button>
  </div>
  <div class="seek"><span id="cur">0:00</span><input type="range" id="sk" min="0" max="1000" value="0" aria-label="Posisi"><span id="dur">0:00</span></div>
 </div>
 <div class="vol"><span aria-hidden="true">🔊</span><input type="range" id="vl" min="0" max="100" value="80" aria-label="Volume"></div>
</div>
<audio id="au" preload="none"></audio>
<script>
const $=s=>document.querySelector(s), au=$('#au'), APP='Hening';
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let key=ls.get('h_key',''), base=ls.get('h_base','https://api.audius.co/v1'), favs=ls.get('h_favs',[]);
let tab='Trending', list=[], cur=null, shuffle=false, repeat=0, seq=0;
const TABS=['Trending','Indonesia','Electronic','Hip-Hop/Rap','Lo-Fi','Pop','Rock','Ambient','Jazz','Favorit'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>s>0?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const art=t=>t.artwork&&(t.artwork['150x150']||t.artwork['480x480']||'')||'';
const link=t=>t.permalink?'https://audius.co'+t.permalink:'https://audius.co';
const streamUrl=t=>`${base}/tracks/${encodeURIComponent(t.id)}/stream?app_name=${APP}`+(key?`&api_key=${encodeURIComponent(key)}`:'');

async function api(path,params={}){
  const u=new URL(base+path);u.searchParams.set('app_name',APP);
  for(const k in params)u.searchParams.set(k,params[k]);
  const r=await fetch(u,{headers:key?{Authorization:'Bearer '+key}:{}});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return (await r.json()).data||[];
}
async function load(){
  const my=++seq, q=$('#q').value.trim(), box=$('#list');
  if(tab==='Favorit'&&!q){list=favs;return draw()}
  box.innerHTML='<div class="msg">Memuat…</div>';
  try{
    let d;
    if(q)d=await api('/tracks/search',{query:q,limit:40});
    else if(tab==='Indonesia'){
      const KW=['indonesia','indie indonesia','jakarta','bandung','yogyakarta','bahasa indonesia'];
      const rs=await Promise.allSettled(KW.map(k=>api('/tracks/search',{query:k,limit:15})));
      if(rs.every(r=>r.status==='rejected'))throw rs[0].reason;
      const seen=new Set();d=[];
      for(let i=0;i<15;i++)for(const r of rs){const t=r.status==='fulfilled'&&r.value[i];if(t&&!seen.has(t.id)){seen.add(t.id);d.push(t)}}
    }
    else d=await api('/tracks/trending',tab==='Trending'?{limit:40}:{genre:tab,limit:40});
    if(my!==seq)return;
    list=d.filter(t=>t.is_streamable!==false);draw();
  }catch(e){
    if(my!==seq)return;
    box.innerHTML=`<div class="msg">Gagal memuat katalog (${esc(e.message)}).<br><br>Buka ⚙, isi kunci API Audius atau ganti server, lalu coba lagi. Pastikan halaman ini dibuka lewat hosting (https), bukan dari file lokal.</div>`;
  }
}
function draw(){
  const box=$('#list');
  if(!list.length){box.innerHTML='<div class="msg">'+(tab==='Favorit'?'Belum ada favorit. Tekan ♡ pada lagu.':'Tidak ada hasil.')+'</div>';return}
  box.innerHTML=list.map((t,i)=>`<div class="row${cur&&cur.id===t.id?' cur':''}" data-i="${i}">
   <div class="cov" style="background-image:url('${esc(art(t))}')"></div>
   <div style="min-width:0"><div class="t">${esc(t.title)}</div><div class="s"><a href="${link(t)}" target="_blank" rel="noopener" data-x>${esc((t.user&&t.user.name)||'Artis')}</a> · Audius</div></div>
   <div class="d">${fmt(t.duration)}</div>
   <button class="heart${favs.some(f=>f.id===t.id)?' on':''}" data-f aria-label="Favorit">${favs.some(f=>f.id===t.id)?'♥':'♡'}</button></div>`).join('');
}
function play(t){
  cur=t;au.src=streamUrl(t);au.play().catch(()=>{});
  $('#nt').textContent=t.title;$('#ns').innerHTML=`<a href="${link(t)}" target="_blank" rel="noopener" style="color:inherit">${esc((t.user&&t.user.name)||'Artis')}</a> · Audius`;
  $('#ncov').style.backgroundImage=`url('${art(t)}')`;draw();
  if('mediaSession' in navigator){const a=t.artwork&&(t.artwork['480x480']||art(t));
    navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:(t.user&&t.user.name)||'',artwork:a?[{src:a}]:[]})}
}
function step(d){
  if(!list.length)return;let i=list.findIndex(t=>cur&&t.id===cur.id);
  if(shuffle&&list.length>1){let r;do{r=Math.floor(Math.random()*list.length)}while(r===i);i=r}
  else{i+=d;if(i<0)i=0;if(i>=list.length){if(repeat===1)i=0;else return au.pause()}}
  play(list[i]);
}
$('#list').onclick=e=>{
  if(e.target.closest('[data-x]'))return;
  const r=e.target.closest('.row');if(!r)return;const t=list[+r.dataset.i];
  if(e.target.closest('[data-f]')){
    favs=favs.some(f=>f.id===t.id)?favs.filter(f=>f.id!==t.id):[...favs,t];ls.set('h_favs',favs);
    if(tab==='Favorit'&&!$('#q').value){list=favs}draw();return}
  play(t);
};
function chips(){$('#chips').innerHTML=TABS.map(n=>`<button class="${n===tab?'on':''}">${n==='Trending'?'Populer':n}</button>`).join('')}
$('#chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=TABS[[...b.parentNode.children].indexOf(b)];$('#q').value='';chips();load()};
let qt;$('#q').oninput=()=>{clearTimeout(qt);qt=setTimeout(load,350)};
$('#gear').onclick=()=>{const s=$('#set');s.style.display=s.style.display==='block'?'none':'block'};
$('#key').value=key;$('#base').value=base;
$('#key').onchange=e=>{key=e.target.value.trim();ls.set('h_key',key);load()};
$('#base').onchange=e=>{base=e.target.value;ls.set('h_base',base);load()};
const toggle=()=>{if(!cur){if(list.length)play(list[0]);return}au.paused?au.play():au.pause()};
$('#pp').onclick=toggle;$('#next').onclick=()=>step(1);
$('#prev').onclick=()=>{if(au.currentTime>3)au.currentTime=0;else step(-1)};
$('#shuf').onclick=e=>{shuffle=!shuffle;e.currentTarget.classList.toggle('on',shuffle)};
$('#rep').onclick=e=>{repeat=(repeat+1)%3;e.currentTarget.classList.toggle('on',repeat>0);e.currentTarget.textContent=repeat===2?'⟲¹':'⟲'};
au.onplay=()=>$('#pp').textContent='⏸';au.onpause=()=>$('#pp').textContent='▶';
au.onended=()=>{if(repeat===2){au.currentTime=0;au.play()}else step(1)};
au.onerror=()=>{if(cur)$('#ns').textContent='Lagu gagal dimuat. Coba lagu lain atau periksa pengaturan.'};
au.ontimeupdate=()=>{if(au.duration){$('#sk').value=au.currentTime/au.duration*1000;$('#cur').textContent=fmt(au.currentTime);$('#dur').textContent=fmt(au.duration)}};
$('#sk').oninput=e=>{if(au.duration)au.currentTime=e.target.value/1000*au.duration};
$('#vl').oninput=e=>au.volume=e.target.value/100;au.volume=.8;
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type!=='range')return;
  if(e.code==='Space'){e.preventDefault();toggle()}if(e.code==='ArrowRight')step(1);if(e.code==='ArrowLeft')step(-1)});
if('mediaSession' in navigator){const m=navigator.mediaSession;
  m.setActionHandler('play',()=>au.play());m.setActionHandler('pause',()=>au.pause());
  m.setActionHandler('nexttrack',()=>step(1));m.setActionHandler('previoustrack',()=>step(-1))}
chips();load();
</script>
</body>
</html>
